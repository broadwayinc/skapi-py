[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "skapi"
version = "2.4.4"
description = "Serverless backend for Python: sign-in, users and a database, with the Skapi API."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
authors = [{ name = "broadway Inc." }]
keywords = ["backend", "skapi", "api", "serverless", "database", "authentication"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = []

[project.optional-dependencies]
# Client-side record encryption (skapi.Skapi(..., encryption=True)): pip install "skapi[encryption]"
encryption = ["cryptography>=3.4"]

[project.urls]
Homepage = "https://www.skapi.com"
Documentation = "https://py.skapi.com"

[tool.setuptools.packages.find]
where = ["src"]
